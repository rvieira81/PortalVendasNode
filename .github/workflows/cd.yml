# Entrega contínua:
#   push na main  → testes → imagens no GHCR (tag = SHA) → homologação
#   tag v*        → testes → imagens (tag = versão) → produção (com aprovação manual no environment "producao")
name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRO: ghcr.io
  IMAGEM_API: ghcr.io/${{ github.repository_owner }}/portalvendas-api
  IMAGEM_WEB: ghcr.io/${{ github.repository_owner }}/portalvendas-web

jobs:
  testes:
    uses: ./.github/workflows/ci.yml

  publicar:
    name: Publicar imagens
    runs-on: ubuntu-latest
    needs: testes
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
    steps:
      - uses: actions/checkout@v7
      - id: versao
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "versao=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"; else echo "versao=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGEM_API }}:${{ steps.versao.outputs.versao }}
            ${{ env.IMAGEM_API }}:${{ startsWith(github.ref, 'refs/tags/v') && 'latest' || 'main' }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGEM_WEB }}:${{ steps.versao.outputs.versao }}
            ${{ env.IMAGEM_WEB }}:${{ startsWith(github.ref, 'refs/tags/v') && 'latest' || 'main' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  homologacao:
    name: Implantar em homologação
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: publicar
    environment:
      name: homologacao
      url: ${{ vars.URL_HOMOLOGACAO }}
    steps:
      - name: Deploy via SSH
        env:
          CHAVE: ${{ secrets.SSH_CHAVE_PRIVADA }}
          HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DESTINO: ${{ secrets.SSH_DESTINO }}       # usuario@servidor
          PASTA: ${{ vars.PASTA_APLICACAO || '/opt/portalvendas' }}
          VERSAO: ${{ needs.publicar.outputs.versao }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$CHAVE" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          echo "$HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy "$DESTINO" "cd $PASTA && ./deploy/implantar.sh $VERSAO"
      - name: Smoke test
        if: vars.URL_HOMOLOGACAO != ''
        run: curl -fsS --retry 5 --retry-delay 5 "${{ vars.URL_HOMOLOGACAO }}/api/health"

  producao:
    name: Implantar em produção
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: publicar
    environment:
      name: producao      # configure "Required reviewers" no GitHub para exigir aprovação
      url: ${{ vars.URL_PRODUCAO }}
    steps:
      - name: Deploy via SSH
        env:
          CHAVE: ${{ secrets.SSH_CHAVE_PRIVADA }}
          HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DESTINO: ${{ secrets.SSH_DESTINO }}
          PASTA: ${{ vars.PASTA_APLICACAO || '/opt/portalvendas' }}
          VERSAO: ${{ needs.publicar.outputs.versao }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$CHAVE" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          echo "$HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy "$DESTINO" "cd $PASTA && ./deploy/implantar.sh $VERSAO"
      - name: Smoke test
        if: vars.URL_PRODUCAO != ''
        run: curl -fsS --retry 5 --retry-delay 5 "${{ vars.URL_PRODUCAO }}/api/health"
